spring:
  application:
    name: NutriMarket
  task:
    scheduling:
      pool:
        # Meal planning and matching can take minutes; keep them from blocking the other schedulers.
        size: 4
  config:
    import: optional:file:./config/api-keys.yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/nutrimarket?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${MYSQL_USERNAME:nutrimarket}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      # Idempotent presentation accounts and meals; override with an empty optional file to disable.
      data-locations: classpath:demo-data.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
server:
  address: 0.0.0.0
  port: 8080
nutrimarket:
  procurement:
    # Street addresses of the fictional partner stores in the synthetic test catalogue (all in Sydney).
    # Brackets keep the spaces in the store names.
    store-addresses:
      "[FreshMart Central]": "200 George Street, Sydney NSW 2000"
      "[GreenLeaf Grocer]": "45 King Street, Newtown NSW 2042"
      "[ValueBasket Express]": "12 Church Street, Parramatta NSW 2150"
  market:
    policy-version: market-v4
    max-age: 24h
    max-refreshes: 3
    candidate-limit: 20
    confidence-threshold: 0.85
    delivery-attempts: 3
    delivery-delay-ms: 30000
  planning:
    policy-version: planning-v2
    max-revisions: 3
    # Max per-ingredient nutrient deviation for substitutes; daily targets are always preserved.
    substitution-tolerance: 0.2
    max-replans: 2
    delivery-attempts: 3
    delivery-delay-ms: 30000
  # Plans, matches and builds a basket after each cleared assessment for members who gave standing consent.
  pipeline:
    enabled: true
    delay-ms: 10000
  health:
    policy-version: health-rolling-v3
    profile-defaults:
      target-source: NutriMarket application defaults
      targets:
        "1008": {minimum: 1800, maximum: 2200, unit: kcal}
        "1003": {minimum: 70, maximum: 130, unit: g}
        "1004": {minimum: 50, maximum: 80, unit: g}
        "1005": {minimum: 200, maximum: 300, unit: g}
    # Coverage / review rules are prototype settings, not clinical diagnostic thresholds.
    # Expert review only for unusual cases: conditions not listed here (or unrecognised text) and recorded energy
    # beyond review-low/high-ratio of the targets on persistent-days covered days. Listed conditions are planning context.
    routine-conditions: [type 2 diabetes, prediabetes, high blood pressure, hypertension, high cholesterol, overweight, obesity]
    meals-per-day: 3
    persistent-days: 3
    review-low-ratio: 0.5
    review-high-ratio: 1.5
    scheduler-enabled: true
    schedule-delay-ms: 3600000
  dietary:
    confidence-threshold: 0.85
    policy-version: dietary-v1
    max-attempts: 3
    confirmation-ttl: 24h
    min-image-side: 224
    max-image-pixels: 20000000
    max-image-bytes: 10485760
    delivery-delay-ms: 30000
